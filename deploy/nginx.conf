# AURA reverse proxy (LOCAL-test http; HTTPS/certbot is the next pass).
#
# TOPOLOGY (decided after auditing the browser's backend surface): the frontend pages and the backend
# JSON API share several path names (/agents, /outputs, /generate, /marketplace are BOTH App Router
# pages AND backend routes). A single-origin "/api -> backend, rest -> web" split therefore cannot
# disambiguate them. So the backend gets its OWN public origin (prod: api-aura.topengdev.com; local:
# published on :8788), and the browser's NEXT_PUBLIC_AURA_API points at it. No path collisions.
#
# This nginx still fronts BOTH:
#   - server "site"  : the web app (SSR pages, /images, /_next, static). The public front door.
#   - server "api"   : the Fastify backend (full surface). In prod this is the api-* subdomain; locally
#                      it is reached on a separate published port. CORS on the backend allows the site
#                      origin (cross-origin, exactly like the dev :3000 -> :8787 setup).
# A convenience: the site block ALSO proxies the non-colliding backend prefixes (/api/, /health,
# /auth/, /mint-args, /provenance/, /royalty/) so same-origin calls to those work too.

upstream aura_web     { server web:3000; }
upstream aura_backend { server server:8787; }

# Larger body for the create-agent multipart upload (server caps at 12MB; give nginx headroom).
client_max_body_size 16m;

# ---- SITE: the public web front door (port 80 in-container; published as the site port) ----
server {
    listen 80 default_server;
    server_name _;

    # Backend convenience passthrough for the NON-colliding prefixes (same-origin friendliness).
    # The browser's primary backend base is the dedicated API origin; these just also work.
    location /api/        { proxy_pass http://aura_backend; }
    location = /health    { proxy_pass http://aura_backend; }
    location /auth/       { proxy_pass http://aura_backend; }
    location = /mint-args { proxy_pass http://aura_backend; }
    location /provenance/ { proxy_pass http://aura_backend; }
    location /royalty/    { proxy_pass http://aura_backend; }

    # Everything else => the Next web app (pages, /images/*, /_next/*, static assets).
    location / {
        proxy_pass http://aura_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Shared proxy headers for the backend convenience locations above.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- API: the dedicated backend origin (prod: api-aura.topengdev.com; local: separate port) ----
# The FULL backend surface, no page collisions because nothing here serves HTML. This is what the
# browser's NEXT_PUBLIC_AURA_API targets.
server {
    listen 81;
    server_name _;

    location / {
        proxy_pass http://aura_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
