[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
]

# 0G Galileo testnet. NOTE: chainId is 16602 (live RPC), NOT 16601 as older docs state.
[rpc_endpoints]
galileo = "https://evmrpc-testnet.0g.ai"
