[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# MANDATORY for 0G Galileo (16602): the ReentrancyGuardTransient guard uses EIP-1153
# transient storage (TSTORE/TLOAD), which only compiles+deploys under the cancun EVM.
# Smoke-confirmed: without this the transient guard fails to compile/deploy. Do NOT remove.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
]

# 0G Galileo testnet. NOTE: chainId is 16602 (live RPC), NOT 16601 as older docs state.
[rpc_endpoints]
galileo = "https://evmrpc-testnet.0g.ai"
